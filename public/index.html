<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- For Responsiveness -->
    <title>IPChat - Room-Based Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1>[<span>Gupt</span>Chat]</h1>
            <p class="subtitle">Enter a shared IP address to join</p>
            <form id="join-form">
                <div class="form-group">
                    <label>USERNAME</label>
                    <input type="text" id="username" placeholder="e.g. alice" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>IP ADDRESS (ROOM CODE)</label>
                    <input type="text" id="room" placeholder="e.g. 192.168.1.1" required autocomplete="off">
                </div>
                <button type="submit" class="btn">CONNECT &rarr;</button>
            </form>
        </div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-screen" class="screen hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="logo">[<span>Gupt</span>Chat]</h2>
                <button id="mobile-toggle" class="mobile-only btn-outline">Menu</button>
            </div>

            <div class="sidebar-content" id="sidebar-content">
                <div class="panel room-info">
                    <h3>ROOM</h3>
                    <p id="room-name" class="highlight">8080</p>
                    <p class="online-count"><span class="dot"></span> <span id="user-count">1</span> online</p>
                </div>
                <div class="panel members">
                    <h3>MEMBERS</h3>
                    <ul id="users-list"></ul>
                </div>
                <button id="leave-btn" class="btn-outline">&larr; Leave Room</button>
            </div>
        </aside>

        <main class="chat-main">
            <header class="chat-header">
                <div>ROOM // <span id="header-room-name" class="highlight">8080</span></div>
                <div class="header-actions">
                    <button id="clear-chat-btn" class="btn-outline small-btn">🗑️ Clear</button>
                    <span id="current-username" class="user-badge">user</span>
                </div>
            </header>

            <div class="chat-messages" id="chat-messages">
                <div class="system-msg">- Start of conversation -</div>
            </div>

            <div class="chat-input-container">
                <div id="typing-indicator" class="typing-text"></div>
                <form id="chat-form">
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                    <button type="button" id="img-btn" class="icon-btn" title="Send Image">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </button>
                    <input type="text" id="msg" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" class="send-btn">&#10148;</button>
                </form>
            </div>
        </main>
    </div>

    <!-- === IMAGE PREVIEW MODAL === -->
    <div id="image-modal" class="modal hidden">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <!-- Scripts (ye pehle se likha hoga) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>

</html>
